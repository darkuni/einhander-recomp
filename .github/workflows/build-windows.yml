name: Build Windows

# Every push to main builds the package (download it from the run's "Artifacts").
# Publishing a GitHub Release (or pushing a v* tag) also attaches the zip to that release.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL2_VERSION: 2.30.9

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64 and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 ninja-build cmake
          x86_64-w64-mingw32-g++-posix --version | head -1

      - name: SDL2 development package (mingw)
        run: |
          curl -sSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz
          tar xzf sdl.tar.gz
          echo "SDL2_DIR=$PWD/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32" >> $GITHUB_ENV

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: einhander-win64

      - name: Configure
        run: |
          cmake -S src -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/src/mingw.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSDL2_DIR="$SDL2_DIR"

      - name: Build
        run: ninja -C build-win -j4

      - name: Stage package
        run: |
          mkdir -p dist/game
          cp build-win/einhander.exe dist/
          cp "$SDL2_DIR/bin/SDL2.dll" dist/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cat > dist/README.txt <<'TXT'
          Einhander - native Windows port (static recompilation)

          The game is NOT included. First run only: put your own disc image (Einhander.chd,
          or the .cue file and its .bin; North American release SCUS-94243) next to
          einhander.exe or in the "game" folder, then run einhander.exe.
          (Or drag the disc image onto einhander.exe.)

          The disc is imported once into assets.dat and verified to be an exact copy.
          After that the game runs from assets.dat alone - delete the disc image.
          The install is then just:
            einhander.exe, SDL2.dll, assets.dat (+ memcard1.mcd, einhander.ini)

          F1 or Esc (Start+Select on a controller) opens the settings menu, including
          Keyboard keys and Controller buttons for rebinding. Hold Tab to fast-forward.
          Saves go to memcard1.mcd next to the exe (a standard PS1 memory card image,
          usable in emulators). Settings are in einhander.ini.
          TXT
          sed -i 's/^          //' dist/README.txt
          ls -la dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: einhander-win64
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ZIP=Einhander-${GITHUB_REF_NAME}-win64.zip
          mkdir -p pkg && cp -r dist pkg/Einhander
          (cd pkg && zip -qr ../$ZIP Einhander)
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
